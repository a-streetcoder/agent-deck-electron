appId: com.streetcoding.agentdeck
productName: Agent Deck
artifactName: Agent-Deck-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - apps/desktop/*.js
  - "!apps/desktop/*.test.js"
  - apps/desktop/preload.cjs
  - apps/desktop/sign-in.html
  - apps/web/dist/**
  - dist/server/**
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/node-pty/build/Release/**"

extraResources:
  - from: packages/loop-catalog-native/native
    to: loop-catalog-native
    filter:
      - "*.node"
  - from: build/skill-engine-native
    to: skill-engine-native
    filter:
      - "*.node"
  - from: packages/resources/builtin-agents
    to: builtin-agents
  - from: packages/resources/builtin-prompts
    to: builtin-prompts
  - from: build/pi-runtime/node_modules
    to: pi-runtime/node_modules
    filter:
      - "**/*"
      - "!.pnpm/**"
  - from: build/pi-runtime/node_modules/.pnpm
    to: pi-runtime/node_modules/.pnpm

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: dir
      arch: x64
  # electron-updater rejects an update whose Authenticode publisher differs from
  # azureSignOptions.publisherName (set in electron-builder.win-signed.yml).
  verifyUpdateCodeSignature: true

nsis:
  oneClick: true
  perMachine: false

# DST-04: electron-updater feed; latest.yml (with sha512) is uploaded with the installer.
publish:
  provider: github
  owner: a-streetcoder
  repo: agent-deck-electron
  releaseType: draft

linux:
  icon: build/icon.png

dmg:
  title: Agent Deck ${version}
  sign: true
