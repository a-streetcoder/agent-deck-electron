<!doctype html>
<!-- ade-zvv5: shown when a cloudflared remote launch has no cached Access token.
     The button asks main (IPC "remote-sign-in") to run `cloudflared access login`;
     on success main loads the remote app in this window. The token never reaches this page. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <title>Agent Deck</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #f7f7f8;
        color: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #1e1e20;
          color: #f5f5f7;
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      .drag {
        position: fixed;
        inset: 0 0 auto 0;
        height: 40px;
        -webkit-app-region: drag;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .muted {
        opacity: 0.7;
      }
      .error {
        color: #d93636;
        white-space: pre-wrap;
        word-break: break-word;
      }
      button {
        font: inherit;
        padding: 0.5rem 1.2rem;
        margin: 0.25rem;
        border-radius: 6px;
        cursor: pointer;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <main>
      <h1>Sign in to Agent Deck</h1>
      <p class="muted">Cloudflare Access: <span id="team"></span></p>
      <p id="status" role="status" aria-live="polite">Your browser opens to approve the sign-in.</p>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="start" type="button">Sign in with your browser</button>
      <button id="cancel" type="button" hidden>Cancel</button>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      $("team").textContent = new URLSearchParams(location.search).get("teamDomain") || "";

      $("start").addEventListener("click", async () => {
        $("start").hidden = true;
        $("cancel").hidden = false;
        $("error").hidden = true;
        $("status").textContent = "Waiting for your browser: approve the request there.";
        const result = await window.agentDeck.remoteSignIn("start");
        if (result.ok) {
          $("status").textContent = "Signed in. Loading Agent Deck...";
          $("cancel").hidden = true;
          return;
        }
        $("status").textContent = "Sign-in did not complete.";
        $("error").textContent = result.error;
        $("error").hidden = false;
        $("cancel").hidden = true;
        $("start").textContent = "Try again";
        $("start").hidden = false;
      });

      $("cancel").addEventListener("click", () => {
        void window.agentDeck.remoteSignIn("cancel");
      });
    </script>
  </body>
</html>
