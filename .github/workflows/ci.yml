name: CI

# Fast static checks fail first; then the real-pi + unit matrix;
# then the Playwright e2e (UI streaming + the Electron shell) under xvfb.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, plus package read so `pnpm install` can fetch the private
# @a-streetcoder/skill-engine-native from GitHub Packages (the .npmrc reads GITHUB_TOKEN).
# The built-in token works if the package grants this repo read access; otherwise set a
# PACKAGES_READ_TOKEN secret (a PAT with read:packages) and it is preferred automatically.
permissions:
  contents: read
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  # Fast fail-fast feedback (~30s): static checks on one OS.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  native-security:
    name: Native Loop security (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            package: pnpm exec electron-builder --linux dir --x64 --publish never
          - name: windows-x64
            os: windows-latest
            platform: win32
            arch: x64
            package: pnpm exec electron-builder --win dir --x64 --publish never
          - name: macos-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
            package: pnpm exec electron-builder --mac dir --arm64 --publish never -c.mac.notarize=false -c.mac.hardenedRuntime=false
          - name: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
            package: pnpm exec electron-builder --mac dir --x64 --publish never -c.mac.notarize=false -c.mac.hardenedRuntime=false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/loop-catalog-native -> packages/loop-catalog-native/target
          shared-key: loop-catalog-native-${{ matrix.name }}
      - run: pnpm install --frozen-lockfile
      - name: Rust formatting, lint, and security tests
        shell: bash
        run: |
          cargo fmt --manifest-path packages/loop-catalog-native/Cargo.toml -- --check
          cargo clippy --manifest-path packages/loop-catalog-native/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path packages/loop-catalog-native/Cargo.toml --locked
      - run: pnpm build:native
      - run: pnpm --filter @agent-deck/resources test
      - name: Focused Loop retention and engine tests
        shell: bash
        run: |
          pnpm --filter @agent-deck/server exec vitest run \
            test/loopHonestyRoutes.test.ts \
            test/loopEngine.test.ts
          pnpm --filter @agent-deck/server exec vitest run \
            test/git.test.ts \
            -t "session worktree branch ownership"
      - run: pnpm build
      - name: Package Electron and run packaged HTTP CRUD containment smoke
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          ${{ matrix.package }}
          node scripts/smoke-packaged-loop-catalog.mjs release "${{ matrix.platform }}" "${{ matrix.arch }}"

  # Units + real-pi integration (the pinned pi binary provides deterministic,
  # keyless runs). Linux + Windows are the ship targets and BLOCK. macOS is
  # ADVISORY (continue-on-error): it is not a ship target for the cross-plat
  # port, and its runner keeps producing environment-specific real-pi/native
  # flakes (node-pty spawn-helper perms, managed_subagent bridge-registration
  # timing) that would otherwise mask genuine regressions on the platforms we
  # actually ship. It still runs and reports, so portability bugs it catches
  # (e.g. the /var→/private/var realpath test fix) stay visible.
  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/loop-catalog-native -> packages/loop-catalog-native/target
          shared-key: loop-catalog-native-tests-${{ runner.os }}
      - run: pnpm build:native
      - run: pnpm test
      - run: pnpm --filter @agent-deck/web build
      # Real-pi vitest integration (pi-host + server). The e2e package's
      # Playwright suite runs in the dedicated e2e job, so exclude it here.
      - run: pnpm -r --filter '!@agent-deck/e2e' test:pi

  # Playwright e2e — the streaming UI and the Electron desktop shell. Runs on
  # Linux (under xvfb) and Windows, since both are ship targets.
  e2e:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/loop-catalog-native -> packages/loop-catalog-native/target
          shared-key: loop-catalog-native-e2e-${{ runner.os }}
      - run: pnpm build:native
      # pnpm may not run Electron's postinstall on a frozen install; fetch its
      # binary explicitly so the desktop-shell e2e can launch it. (bash is on
      # the Windows runner too.)
      - name: Ensure Electron binary
        shell: bash
        run: |
          ELECTRON_PACKAGE_DIR=apps/desktop
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Electron 39.2+ currently terminates with EXCEPTION_BREAKPOINT when
            # Playwright attaches its mandatory main-process inspector on Windows.
            # The test-only e2e runtime/launcher pair is the last known working
            # inspector combination; packaging and Linux E2E remain on Electron 43.
            ELECTRON_PACKAGE_DIR=e2e
          fi
          ELECTRON_DIR=$(node -e "console.log(require('path').dirname(require.resolve('electron/package.json', { paths: [require('path').resolve(process.argv[1])] })))" "$ELECTRON_PACKAGE_DIR")
          node "$ELECTRON_DIR/install.js"
      - run: pnpm --filter @agent-deck/web build
      # Keep the Windows Electron launch independent from Chromium installation
      # and browser specs. Playwright otherwise suppresses the child stderr when
      # Electron exits before its debugger handshake, so retain its launch log.
      - name: Run Electron e2e — Windows
        if: runner.os == 'Windows'
        run: pnpm exec playwright test --project=desktop
        working-directory: e2e
        env:
          DEBUG: pw:browser*
      - name: Install Playwright browsers + system deps
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Run Playwright e2e — Linux (xvfb for Electron)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test
        working-directory: e2e
      - name: Run browser e2e — Windows
        if: runner.os == 'Windows'
        run: pnpm exec playwright test --project=browser --no-deps
        working-directory: e2e
